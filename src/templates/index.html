<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Black Papaya Solver</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f1419;
            --panel: #162029;
            --panel-2: #1d2b36;
            --ink: #f3efe3;
            --muted: #94a7b7;
            --accent: #d7a449;
            --accent-2: #79c2ff;
            --danger: #e16c62;
            --success: #8bcf7a;
            --border: rgba(243, 239, 227, 0.12);
            --shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at top, rgba(121, 194, 255, 0.18), transparent 35%),
                radial-gradient(circle at right, rgba(215, 164, 73, 0.12), transparent 25%),
                linear-gradient(180deg, #0f1419, #111c22 42%, #0a1015);
            color: var(--ink);
        }

        main {
            width: min(1680px, calc(100% - 2.5rem));
            margin: 0 auto;
            padding: 2rem 0 4rem;
        }

        .hero,
        .panel {
            border: 1px solid var(--border);
            background: rgba(22, 32, 41, 0.86);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }

        .hero {
            padding: 2.25rem;
            margin-bottom: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: auto -8rem -8rem auto;
            width: 18rem;
            height: 18rem;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(215, 164, 73, 0.35), transparent 65%);
            pointer-events: none;
        }

        h1,
        h2 {
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            max-width: 12ch;
            line-height: 0.92;
        }

        h2 {
            font-size: 1.2rem;
        }

        p {
            color: var(--muted);
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            gap: 1.5rem;
        }

        .panel {
            padding: 1.25rem;
        }

        .eyebrow {
            margin: 0 0 0.75rem;
            color: var(--accent-2);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-size: 0.75rem;
        }

        .hero-copy {
            max-width: 56rem;
        }

        .hero-copy p:last-child {
            margin-bottom: 0;
        }

        .stack {
            display: grid;
            gap: 1.5rem;
        }

        .side-panel {
            display: grid;
            gap: 1rem;
            align-content: start;
        }

        .field-label {
            display: block;
            margin-bottom: 0.45rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        input[type="password"] {
            width: 100%;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(9, 14, 18, 0.7);
            color: var(--ink);
            padding: 0.85rem 1rem;
            font: inherit;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 0.75rem 1rem;
            font: inherit;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .button-primary {
            background: linear-gradient(135deg, var(--accent), #e7c57d);
            color: #22170a;
            font-weight: 700;
        }

        .button-secondary {
            background: rgba(121, 194, 255, 0.16);
            color: var(--ink);
        }

        .button-ghost {
            background: rgba(243, 239, 227, 0.06);
            color: var(--muted);
        }

        .actions,
        .stats-grid,
        .result-groups {
            display: grid;
            gap: 0.75rem;
        }

        .stats-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .stat {
            padding: 0.9rem 1rem;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
        }

        .stat strong {
            display: block;
            font-size: 1.35rem;
        }

        .stat span {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .message {
            border-radius: 18px;
            padding: 0.95rem 1rem;
            border: 1px solid var(--border);
        }

        .message.success {
            background: rgba(139, 207, 122, 0.12);
            color: var(--success);
        }

        .message.error {
            background: rgba(225, 108, 98, 0.12);
            color: #ffd1cd;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .section-head p {
            margin: 0;
        }

        .boss-list {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            align-items: stretch;
        }

        .boss-card {
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.025);
            overflow: hidden;
            min-height: 32rem;
            display: flex;
            flex-direction: column;
        }

        .boss-summary {
            padding: 1rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            min-height: 5.25rem;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(243, 239, 227, 0.08);
            background: rgba(121, 194, 255, 0.045);
        }

        .boss-meta {
            display: flex;
            gap: 0.65rem;
            flex-wrap: wrap;
        }

        .pill {
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.85rem;
        }

        .table-wrap {
            overflow: auto;
            padding: 0 0.85rem 0.85rem;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 0.72rem 0.65rem;
            border-top: 1px solid rgba(243, 239, 227, 0.08);
            vertical-align: middle;
            text-align: left;
        }

        th {
            color: var(--muted);
            font-size: 0.74rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            background: rgba(22, 32, 41, 0.96);
            backdrop-filter: blur(8px);
            z-index: 1;
        }

        .player-name {
            display: grid;
            gap: 0.2rem;
        }

        .player-name-compact {
            min-width: 11rem;
        }

        .player-name strong {
            color: var(--class-color, var(--ink));
            font-size: 0.98rem;
        }

        .muted {
            color: var(--muted);
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.26rem 0.55rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 0.84rem;
        }

        .restriction-table th:last-child,
        .restriction-table td:last-child {
            width: 8.75rem;
        }

        .restriction-row td {
            white-space: nowrap;
        }

        .cycle-form {
            display: flex;
        }

        .cycle-button {
            width: 100%;
            padding: 0.45rem 0.8rem;
            border-radius: 16px;
            border: 1px solid transparent;
            display: grid;
            gap: 0.08rem;
            justify-items: start;
            text-align: left;
            line-height: 1.05;
            font-weight: 700;
        }

        .cycle-button small {
            color: inherit;
            opacity: 0.7;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .cycle-button-free {
            background: rgba(243, 239, 227, 0.08);
            border-color: rgba(243, 239, 227, 0.14);
            color: var(--ink);
        }

        .cycle-button-in {
            background: rgba(139, 207, 122, 0.16);
            border-color: rgba(139, 207, 122, 0.26);
            color: var(--success);
        }

        .cycle-button-out {
            background: rgba(225, 108, 98, 0.17);
            border-color: rgba(225, 108, 98, 0.28);
            color: #ffd1cd;
        }

        .cycle-button:hover {
            opacity: 0.96;
        }

        .cycle-button:focus-visible {
            outline: 2px solid rgba(121, 194, 255, 0.7);
            outline-offset: 2px;
        }

        .assigned-flag {
            display: inline-block;
            margin-top: 0.3rem;
            color: var(--accent-2);
            font-size: 0.8rem;
        }

        .result-card {
            padding: 1rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
        }

        .result-groups {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            margin-top: 1rem;
        }

        .result-group {
            padding: 0.9rem;
            border-radius: 16px;
            background: rgba(9, 14, 18, 0.4);
            min-height: 8rem;
        }

        .result-group ul {
            list-style: none;
            margin: 0.75rem 0 0;
            padding: 0;
            display: grid;
            gap: 0.45rem;
        }

        .result-group li {
            display: flex;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .empty {
            padding: 1rem 0;
            color: var(--muted);
        }

        .loading {
            display: none;
            color: var(--accent-2);
            font-size: 0.9rem;
        }

        .htmx-request .loading,
        .htmx-request.loading {
            display: inline;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .result-groups,
            .stats-grid,
            .boss-list {
                grid-template-columns: 1fr;
            }

            .boss-summary {
                align-items: flex-start;
                flex-direction: column;
                min-height: auto;
            }

            .boss-card {
                min-height: auto;
            }

            .table-wrap {
                max-height: none;
                padding: 0 0.75rem 0.75rem;
            }

            .restriction-table th:last-child,
            .restriction-table td:last-child {
                width: 7.75rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <section class="hero">
            <div class="hero-copy">
                <p class="eyebrow">Black Papaya Raid Planner</p>
                <h1>Roster web server-rendered</h1>
                <p>Esta versión carga el roster desde WowAudit, mantiene
                    restricciones exclusivas por jugador y boss, y devuelve propuestas del solver agrupadas por Tank,
                    Heal, Melee y Ranged.</p>
            </div>
        </section>

        {% include "partials/app_shell.html" %}
    </main>
</body>

</html>
